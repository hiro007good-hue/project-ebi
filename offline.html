<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e85d24">
  <title>オフライン | 海老フライ王国AR</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;background:#fff7ed;color:#3b2417}
    *{box-sizing:border-box}body{min-height:100vh;min-height:100svh;margin:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 20%,#ffe3c5,#fff7ed 58%)}
    main{width:min(100%,440px);padding:30px 24px;border:1px solid #f3c59f;border-radius:24px;background:#fff;box-shadow:0 16px 40px #9d47151f;text-align:center}span{display:block;font-size:3.5rem}h1{margin:.4rem 0 1rem;font-size:clamp(1.5rem,7vw,2rem)}p{margin:.7rem 0;line-height:1.75}button{min-height:48px;margin-top:18px;padding:0 24px;border:0;border-radius:999px;background:#e85d24;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #3b2417;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span aria-hidden="true">🦐</span>
    <h1>現在オフラインです</h1>
    <p>GPS・AR機能を利用するには、通信環境をご確認ください。</p>
    <p>通信が復帰したら、ページを再読み込みしてください。保存データは削除されません。</p>
    <button type="button" onclick="location.reload()">再読み込み</button>
  </main>
</body>
</html>
