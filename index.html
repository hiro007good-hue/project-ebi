<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e85d24">
  <title>海老フライ王国AR ～日野町大冒険～</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"><p>海老フライ王国ARを起動しています…</p></main>
  <script src="js/config.js"></script>
  <script src="js/spots.js"></script>
  <script src="js/character.js"></script>
  <script src="js/blink.js"></script>
  <script src="js/idle.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/game.js"></script>
  <script src="js/achievement.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/story.js"></script>
  <script src="js/ending.js"></script>
  <script src="js/save.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/effect.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ar.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var saved = null;
      try { saved = EbiAR.save.loadGame(); } catch (error) { console.warn('セーブデータを読み込めませんでした。', error); }
      EbiAR.game.initialize(saved ? {
        character: saved.player,
        collectedSpotIds: saved.game.collectedSpotIds,
        startedAt: saved.game.startedAt
      } : undefined);
      EbiAR.game.connectSystems();
      EbiAR.ui.init();
      EbiAR.Story.initialize(saved && saved.story);
      EbiAR.Ending.initialize(saved && saved.ending);
      EbiAR.events.on('ui:start-requested', function () {
        EbiAR.sound.unlock();
        EbiAR.sound.playBgm('adventure', { fadeMs: 300 });
        EbiAR.gps.start();
        EbiAR.events.emit('game:started', { started: true, startedAt: new Date().toISOString() });
      });
      EbiAR.effect.init();
    });
  </script>
</body>
</html>
