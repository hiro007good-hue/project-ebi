<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e85d24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="海老フライ王国AR">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./images/icons/apple-touch-icon.png">
  <title>海老フライ王国AR ～日野町大冒険～</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="opening.css?rev=opening-live-hints-20260909">
</head>
<body>
  <main id="app" aria-live="polite"><p>海老フライ王国ARを起動しています…</p></main>
  <section id="opening-screen" class="opening-screen" role="dialog" aria-modal="true" aria-labelledby="opening-title" aria-describedby="opening-hint">
    <img class="opening-screen__art" src="images/opening/opening-adventure-live-hints.png" alt="" aria-hidden="true" decoding="async" fetchpriority="high" style="opacity:1">
    <div class="opening-screen__content">
      <header class="opening-screen__header" style="visibility:hidden">
        <p class="opening-screen__kicker">Project EBI</p>
        <h1 id="opening-title">海老フライ王国AR</h1>
        <p>～日野町大冒険～</p>
      </header>
      <div class="opening-screen__visual" data-opening-art-slot>
        <img class="opening-screen__hero" src="images/characters/ebi-maru.webp" alt="冒険へ出発するエビ丸" decoding="async" fetchpriority="high" style="display:none">
      </div>
      <p id="opening-hint" class="opening-screen__hint">日野町には、まだ見つかっていない海老たちがいる…</p>
      <div class="opening-screen__footer">
        <p id="opening-status" class="opening-screen__status" role="status" aria-live="polite">冒険の準備中…</p>
        <span class="opening-screen__loader" aria-hidden="true"></span>
        <button id="opening-start" class="opening-screen__cta" type="button" disabled>タップして冒険をはじめる</button>
      </div>
    </div>
  </section>
  <script src="js/config.js"></script>
  <script src="js/spots.js?rev=hamada-rewards-20260917"></script>
  <script src="js/character.js?rev=hamada-rewards-20260917"></script>
  <script src="js/blink.js"></script>
  <script src="js/idle.js"></script>
  <script src="js/photo.js?rev=photo-save-ios-share-20260914-3"></script>
  <script src="js/gps.js?rev=hamada-rewards-20260917"></script>
  <script src="js/game.js?rev=hamada-rewards-20260917"></script>
  <script src="js/achievement.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/story.js"></script>
  <script src="js/ending.js"></script>
  <script src="js/save.js?rev=hamada-rewards-20260917"></script>
  <script src="js/sound.js?rev=safari-audio-selector-diagnostic"></script>
  <script src="js/effect.js"></script>
  <script src="js/ui.js?rev=hamada-rewards-20260917"></script>
  <script src="js/opening.js?rev=safari-audio-selector-diagnostic"></script>
  <script src="js/ar.js?rev=hamada-rewards-20260917"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var saved = null;
      var deferredSystemsInitialized = false;
      function initializeDeferredSystems() {
        if (deferredSystemsInitialized) return;
        deferredSystemsInitialized = true;
        EbiAR.Story.initialize(saved && saved.story);
        EbiAR.Ending.initialize(saved && saved.ending);
        EbiAR.ui.showScreen('title');
      }
      try { saved = EbiAR.save.loadGame(); } catch (error) { console.warn('セーブデータを読み込めませんでした。', error); }
      EbiAR.game.initialize(saved ? {
        character: saved.player,
        collectedSpotIds: saved.game.collectedSpotIds,
        startedAt: saved.game.startedAt
      } : undefined);
      EbiAR.game.connectSystems();
      EbiAR.ui.init();
      EbiAR.events.on('ui:start-requested', function () {
        EbiAR.sound.unlock();
        EbiAR.gps.start();
        EbiAR.events.emit('game:started', { started: true, startedAt: new Date().toISOString() });
      });
      EbiAR.effect.init();
      try {
        if (!EbiAR.Opening || !EbiAR.Opening.initialize({ onComplete: initializeDeferredSystems })) initializeDeferredSystems();
      } catch (error) {
        initializeDeferredSystems();
      }
    });
  </script>
  <script src="./js/pwa.js"></script>
  <script>
    (function () {
      try {
        if (new URLSearchParams(window.location.search).get('swDiag') !== '1') return;
        var script = document.createElement('script');
        script.src = './js/sw-diagnostic.js?rev=safari-sw-range-diagnostic-2';
        document.head.appendChild(script);
      } catch (error) { /* 診断機能はゲーム起動を妨げない。 */ }
    }());
  </script>
</body>
</html>
